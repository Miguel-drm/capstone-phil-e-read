services:
  # Tagalog & English Vosk WebSocket Server (Memory Optimized)
  - type: web
    name: phil-e-read-vosk-server
    runtime: python
    plan: free  # Optimized for 512MB. Change to 'starter' for better performance
    buildCommand: bash build.sh
    startCommand: python server.py
    envVars:
      - key: PORT
        generateValue: true  # Render will assign the port
      - key: PYTHON_VERSION
        value: 3.11.0
      # Memory optimization settings (CRITICAL for free tier)
      - key: VOSK_LAZY_LOAD
        value: "true"  # Load models on-demand, not at startup
      - key: MAX_CONNECTIONS
        value: "5"  # Limit concurrent connections
      - key: USE_SMALL_MODELS
        value: "true"  # Use smaller models to fit in 512MB RAM
      # Download both models
      - key: DOWNLOAD_TAGALOG
        value: "true"
      - key: DOWNLOAD_ENGLISH
        value: "true"
      # Model paths
      - key: VOSK_TAGALOG_MODEL_PATH
        value: ./model-tagalog
      - key: VOSK_ENGLISH_MODEL_PATH
        value: ./model-english
      # Model repositories (using small English model for memory efficiency)
      - key: HUGGINGFACE_TAGALOG_MODEL_REPO
        value: Migueldrm/vosk-model-tl-ph-generic-0.6
      - key: HUGGINGFACE_ENGLISH_MODEL_REPO
        value: alphacep/vosk-model-small-en-us-0.15

