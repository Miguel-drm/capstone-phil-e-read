services:
  # English-only Vosk WebSocket Server
  # NOTE: Requires uploading small model OR using paid tier for full model
  - type: web
    name: phil-e-read-vosk-english
    runtime: python
    plan: starter  # Full model requires 2GB RAM (paid tier)
    buildCommand: bash build.sh
    startCommand: python server.py
    envVars:
      - key: PORT
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Memory optimization settings
      - key: VOSK_LAZY_LOAD
        value: "true"
      - key: MAX_CONNECTIONS
        value: "5"
      # Download only English model
      - key: DOWNLOAD_TAGALOG
        value: "false"
      - key: DOWNLOAD_ENGLISH
        value: "true"
      # Model paths
      - key: VOSK_TAGALOG_MODEL_PATH
        value: ./model-tagalog
      - key: VOSK_ENGLISH_MODEL_PATH
        value: ./model-english
      # Model repositories
      # Option 1: Upload small model to YOUR HuggingFace account first
      # HUGGINGFACE_ENGLISH_MODEL_REPO=Migueldrm/vosk-model-small-en-us-0.15
      # Option 2: Use full model (requires starter plan or higher)
      - key: HUGGINGFACE_ENGLISH_MODEL_REPO
        value: Migueldrm/vosk-model-en-us-0.22  # Full model (works now, needs paid tier)
      # Use small models for memory efficiency (if uploaded)
      - key: USE_SMALL_MODELS
        value: "false"  # Set to true if using small model

