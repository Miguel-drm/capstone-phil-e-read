services:
  # English-only Vosk WebSocket Server (Memory Optimized with LGraph)
  - type: web
    name: phil-e-read-vosk-english
    runtime: python
    plan: free  # LGraph model is memory-efficient enough for free tier
    buildCommand: bash build.sh
    startCommand: python server.py
    envVars:
      - key: PORT
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Memory optimization settings
      - key: VOSK_LAZY_LOAD
        value: "true"
      - key: MAX_CONNECTIONS
        value: "5"
      # Download only English model
      - key: DOWNLOAD_TAGALOG
        value: "false"
      - key: DOWNLOAD_ENGLISH
        value: "true"
      # Model paths
      - key: VOSK_TAGALOG_MODEL_PATH
        value: ./model-tagalog
      - key: VOSK_ENGLISH_MODEL_PATH
        value: ./model-english
      # Model repositories - using LGraph model for memory efficiency
      - key: HUGGINGFACE_ENGLISH_MODEL_REPO
        value: Migueldrm/vosk-model-en-us-0.22-lgraph  # LGraph model - fits in 512MB
      # Use small models for memory efficiency
      - key: USE_SMALL_MODELS
        value: "false"

