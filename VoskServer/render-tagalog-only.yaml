services:
  # Tagalog-only Vosk WebSocket Server (Memory Optimized for Free Tier)
  - type: web
    name: phil-e-read-vosk-tagalog
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python server.py
    envVars:
      - key: PORT
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Memory optimization settings
      - key: VOSK_LAZY_LOAD
        value: "true"
      - key: MAX_CONNECTIONS
        value: "5"
      # Download only Tagalog model
      - key: DOWNLOAD_TAGALOG
        value: "true"
      - key: DOWNLOAD_ENGLISH
        value: "false"
      # Model paths
      - key: VOSK_TAGALOG_MODEL_PATH
        value: ./model-tagalog
      - key: VOSK_ENGLISH_MODEL_PATH
        value: ./model-english
      # Model repositories
      - key: HUGGINGFACE_TAGALOG_MODEL_REPO
        value: Migueldrm/vosk-model-tl-ph-generic-0.6
      # Use small models for memory efficiency
      - key: USE_SMALL_MODELS
        value: "true"

